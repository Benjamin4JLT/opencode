version: '3.8'

services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build arguments if needed
        BUN_VERSION: "1.3.2"
    
    container_name: opencode-web-terminal
    
    # Port mappings
    ports:
      - "7681:7681"  # Web terminal (ttyd)
      - "8080:8080"  # OpenCode application
      - "3000:3000"  # Console UI (if applicable)
    
    # Environment variables
    # Create a .env file from env.example and uncomment the line below
    # env_file:
    #   - .env
    
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - PORT=8080
      - TTYD_PORT=7681
      - TTYD_CREDENTIALS=admin:changeme  # CHANGE THIS!
      
      # Add your AI provider keys here (or use .env file)
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    
    # Volumes for persistence
    volumes:
      # Persist OpenCode data
      - opencode-data:/home/opencode/.opencode
      
      # Persist config
      - opencode-config:/home/opencode/.config/opencode
      
      # Persist application data
      - opencode-app-data:/app/data
      
      # Mount logs for easy access
      - ./logs:/app/logs
      
      # Development: mount source code for hot reload (comment out for production)
      # - ./packages:/app/packages
      # - ./package.json:/app/package.json
    
    # Restart policy
    restart: unless-stopped
    
    # Resource limits (adjust based on needs)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    
    # Networking
    networks:
      - opencode-network
    
    # Security settings
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    
    # Uncomment for stricter security
    # read_only: true
    # tmpfs:
    #   - /tmp
    #   - /app/.turbo
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    
    # Health check (override if needed)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7681"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    # Dependencies (add if you add other services)
    # depends_on:
    #   - database
    #   - redis

  # =============================================================================
  # Optional Services
  # =============================================================================

  # Optional: Add nginx reverse proxy for SSL/TLS
  # nginx:
  #   image: nginx:alpine
