  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - opencode
  #   networks:
  #     - opencode-network
  #   restart: unless-stopped

  # Optional: Add database if needed
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: opencode-db
  #   environment:
  #     POSTGRES_DB: opencode
  #     POSTGRES_USER: opencode
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - opencode-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U opencode"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Optional: Add Redis for caching
  # redis:
  #   image: redis:7-alpine
  #   container_name: opencode-redis
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - opencode-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 3

# =============================================================================
# Volumes
# =============================================================================
volumes:
  opencode-data:
    driver: local
    # For production, consider using named volumes or external storage
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /path/to/persistent/storage

  opencode-config:
    driver: local

  opencode-app-data:
    driver: local

  # postgres-data:
